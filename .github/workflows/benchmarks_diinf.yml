name: Benchmarks — DIINF cluster

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run benchmarks on cluster
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Falla rápido y claro si el runner no tiene GPU disponible
      - name: Verificar GPU disponible
        run: nvidia-smi

      # Compila el binario interactivo principal (simulación y matriz GPU)
      - name: Compilar binario principal (make nbody)
        working-directory: nbody_2d
        run: make nbody

      - name: Compilar y ejecutar benchmark
        working-directory: nbody_2d
        run: make benchmark

      # Simulación CUDA (mode=1): seed=42, aleatorio, N=1000, dt=0.01,
      # G=1.0, eps=0.1, steps=500, blockSize=256, gpuMethod=0 (reducción shared).
      # Genera energy_cuda.dat y trajectories_cuda.dat
      - name: Ejecutar simulación CUDA (energy/trajectories)
        working-directory: nbody_2d
        run: printf "42\n0\n1000\n0.01\n1.0\n0.1\n500\n1\n256\n0\n" | ./nbody 2>&1 | tee cluster_run.log

      # Matriz de benchmarks GPU (mode=3): N={256,512,1024,2000} × variantes
      # {básico, shared} × blockDim={64,128,256,512,1024} (usa 100 pasos internos).
      # Genera benchmark_results.dat; se anexa al mismo log de la corrida
      - name: Ejecutar matriz de benchmarks GPU
        working-directory: nbody_2d
        run: printf "42\n0\n1000\n0.01\n1.0\n0.1\n100\n3\n" | ./nbody 2>&1 | tee -a cluster_run.log

      # if: always() → conserva logs y .dat aunque algún paso anterior falle
      - name: Subir artefactos de benchmark
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diinf-benchmarks
          path: |
            nbody_2d/*.dat
            nbody_2d/cluster_run.log
            nbody_2d/benchmark
            nbody_2d/nbody
          retention-days: 14
