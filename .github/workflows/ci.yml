name: CI — N-Body 2D

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test in container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen base local
        run: docker build -t nbody-2d-ci -f nbody_2d/Dockerfile nbody_2d

      - name: Compilar y ejecutar pruebas unitarias CPU (make test)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nbody_2d:/workspace" \
            -w /workspace \
            nbody-2d-ci \
            bash -lc "make test"

      - name: Compilar binario principal (make all)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nbody_2d:/workspace" \
            -w /workspace \
            nbody-2d-ci \
            bash -lc "make all"

      - name: Compilar binario de benchmarks (make benchmark-bin)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nbody_2d:/workspace" \
            -w /workspace \
            nbody-2d-ci \
            bash -lc "make benchmark-bin"

      - name: Nota de alcance
        run: |
          echo "Este CI valida compilación y tests CPU, y compila (sin ejecutar) el binario de benchmarks para detectar roturas en la ruta GPU/benchmark. Benchmarks finales y mediciones GPU se ejecutan fuera de CI."

      - name: Guardar artefacto de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-binaries
          path: |
            nbody_2d/test_runner
            nbody_2d/benchmark
          retention-days: 7
