name: CI — N-Body 2D

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test in container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen base local
        run: docker build -t nbody-2d-ci -f nbody_2d/Dockerfile nbody_2d

      - name: Compilar y ejecutar pruebas unitarias CPU (make test)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nbody_2d:/workspace" \
            -w /workspace \
            nbody-2d-ci \
            bash -lc "make test"

      - name: Compilar binario principal (make all)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nbody_2d:/workspace" \
            -w /workspace \
            nbody-2d-ci \
            bash -lc "make all"

      - name: Compilar binario de benchmarks (make benchmark-bin)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nbody_2d:/workspace" \
            -w /workspace \
            nbody-2d-ci \
            bash -lc "make benchmark-bin"

      - name: Ejecutar benchmarks CPU (make benchmark)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nbody_2d:/workspace" \
            -w /workspace \
            nbody-2d-ci \
            bash -lc "make benchmark"

      - name: Verificar artefactos de benchmark CPU generados
        run: |
          test -f nbody_2d/scaling_parallel.dat
          test -f nbody_2d/scaling_tasks.dat
          test -f nbody_2d/chunk_schedule.dat
          test -f nbody_2d/full_simulation_cpu.dat

      - name: Nota de alcance
        run: |
          echo "Este CI valida compilación y tests CPU, y además ejecuta benchmarks CPU para detectar regresiones funcionales/performance base. Benchmarks finales y mediciones GPU se ejecutan fuera de CI (cluster DIINF)."

      - name: Guardar artefacto de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-binaries
          path: |
            nbody_2d/test_runner
            nbody_2d/benchmark
            nbody_2d/scaling_parallel.dat
            nbody_2d/scaling_tasks.dat
            nbody_2d/chunk_schedule.dat
            nbody_2d/full_simulation_cpu.dat
            nbody_2d/gpu_benchmark_plan.dat
            nbody_2d/gpu_kernel_only.dat
            nbody_2d/gpu_end_to_end.dat
            nbody_2d/cpu_vs_gpu.dat
          retention-days: 7
